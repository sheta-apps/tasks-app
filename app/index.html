<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><title>مهامي اليومية</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f4f1ea;color:#1f2a28;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.top{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;padding:22px 18px 26px;border-radius:0 0 26px 26px}
.top h1{margin:0 0 4px;font-size:26px}.top .d{opacity:.85;font-size:15px}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:6px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#e9c46a;transition:width .3s}
.cnt{margin-top:8px;font-size:14px;opacity:.9}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:14px}
textarea{width:100%;min-height:84px;border:1.5px solid #d8d3c6;border-radius:12px;padding:12px;font:inherit;font-size:17px;resize:vertical;background:#fcfbf8}
textarea:focus{outline:none;border-color:#0f766e}
.hint{font-size:13px;color:#7a766b;margin:6px 2px 10px}
button{font:inherit;cursor:pointer;border:0}
.add{width:100%;background:#0f766e;color:#fff;border-radius:12px;padding:14px;font-size:18px;font-weight:700}
.add:active{background:#115e59}
.old{background:#fff7e0;border:1px solid #ecd48a}
.old b{display:block;margin-bottom:6px}
.old ul{margin:0 0 10px;padding-inline-start:20px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sm{padding:10px 14px;border-radius:10px;font-size:15px;font-weight:600;background:#0f766e;color:#fff}
.sm.g{background:#ece7da;color:#333}
ul.t{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #eee9dc}
.task:last-child{border:0}
.ck{width:44px;height:44px;flex:none;border-radius:50%;border:2.5px solid #9a9686;background:#fff;color:#fff;font-size:22px;line-height:1}
.done .ck{background:#0f766e;border-color:#0f766e}
.tx{flex:1;font-size:18px;line-height:1.5;overflow-wrap:anywhere}
.done .tx{text-decoration:line-through;color:#8a8676}
.del{width:44px;height:44px;flex:none;background:none;font-size:26px;color:#a33}
.empty{text-align:center;color:#8a8676;padding:20px 0;font-size:16px}
.clear{display:block;margin:8px auto 0;background:none;color:#0f766e;font-size:15px;padding:10px;font-weight:600}
h2{font-size:18px;margin:2px 0 6px}
</style></head><body>
<div class="top"><h1>مهامي النهارده</h1><div class="d" id="date"></div>
<div class="bar"><i id="bar"></i></div><div class="cnt" id="cnt"></div></div>
<main>
<div id="old"></div>
<div class="card"><h2>اكتب مهام اليوم</h2>
<textarea id="in" placeholder="اكتب كل مهمة في سطر"></textarea>
<div class="hint">اكتب مهمة أو أكتر، كل مهمة في سطر جديد.</div>
<button class="add" id="add">إضافة</button></div>
<div class="card"><h2>مهام اليوم</h2><ul class="t" id="list"></ul><div id="empty" class="empty">لسه مفيش مهام. اكتب أول مهمة فوق.</div>
<button class="clear" id="clr" style="display:none">امسح المنجز</button></div>
</main>
<script>
var KEY='daily-tasks-v1',S;
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.tasks)S={n:1,tasks:[]}}
function save(){var t=today();S.tasks=S.tasks.filter(function(x){return x.day>=t||!x.done}).slice(-300);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
 var t=today(),td=S.tasks.filter(function(x){return x.day===t}),old=S.tasks.filter(function(x){return x.day<t&&!x.done});
 var dn=td.filter(function(x){return x.done}).length;
 document.getElementById('date').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
 document.getElementById('bar').style.width=(td.length?dn*100/td.length:0)+'%';
 document.getElementById('cnt').textContent=td.length?('خلصت '+dn+' من '+td.length):'ابدأ يومك بكتابة مهامك';
 document.getElementById('empty').style.display=td.length?'none':'block';
 document.getElementById('clr').style.display=dn?'block':'none';
 document.getElementById('list').innerHTML=td.map(function(x){return '<li class="task'+(x.done?' done':'')+'"><button class="ck" data-t="'+x.id+'" aria-label="تم">'+(x.done?'✓':'')+'</button><span class="tx" data-t="'+x.id+'">'+esc(x.text)+'</span><button class="del" data-d="'+x.id+'" aria-label="حذف">×</button></li>'}).join('');
 var o=document.getElementById('old');
 o.innerHTML=old.length?'<div class="card old"><b>فاضل '+old.length+' مهام من الأيام اللي فاتت</b><ul>'+old.map(function(x){return '<li>'+esc(x.text)+'</li>'}).join('')+'</ul><div class="row"><button class="sm" id="carry">انقلهم لليوم</button><button class="sm g" id="drop">امسحهم</button></div></div>':'';
}
document.addEventListener('click',function(e){
 var el=e.target,id=el.getAttribute&&el.getAttribute('data-t'),dd=el.getAttribute&&el.getAttribute('data-d'),t=today();
 if(id){S.tasks.forEach(function(x){if(x.id==id)x.done=!x.done});save();render()}
 else if(dd){S.tasks=S.tasks.filter(function(x){return x.id!=dd});save();render()}
 else if(el.id==='carry'){S.tasks.forEach(function(x){if(x.day<t&&!x.done)x.day=t});save();render()}
 else if(el.id==='drop'){S.tasks=S.tasks.filter(function(x){return !(x.day<t&&!x.done)});save();render()}
 else if(el.id==='clr'){S.tasks=S.tasks.filter(function(x){return !(x.day===t&&x.done)});save();render()}
 else if(el.id==='add'){var v=document.getElementById('in');v.value.split('\n').forEach(function(l){l=l.trim();if(l)S.tasks.push({id:S.n++,text:l,done:false,day:t})});v.value='';save();render()}
});
load();render();
document.addEventListener('visibilitychange',function(){if(!document.hidden){load();render()}});
</script></body></html>
